name: Bug Report
description: File a bug report or report a false positive detection
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue with EnvGuard!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is or what false positive occurred.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: EnvGuard Version
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Steps or minimal snippet to reproduce the behavior.
    validations:
      required: true
